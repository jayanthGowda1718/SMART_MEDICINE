<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor - Smart Medicine Reminder</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Smart Medicine Reminder</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="users.html">Users</a>
                <a href="medicines.html">Medicines</a>
                <a href="schedules.html">Schedules</a>
                <a href="notifications.html">Notifications</a>
                <a href="logs.html">Logs</a>
                <a href="doctor.html">Doctor</a>
                <a href="messages.html">Messages</a>
                <a href="appointments.html">Appointments</a>
                <span id="userInfo" style="color:white; margin-left:auto; margin-right:15px;"></span>
                <button onclick="logout()" style="padding:8px 16px; font-size:14px; background:#f5576c;">Logout</button>
            </nav>
        </header>

        <main>
            <h2>Doctor</h2>

            <!-- Assign / change doctor -->
            <div class="form-container">
                <h3>Assign a Doctor</h3>
                <form id="assignDoctorForm">
                    <div class="form-group">
                        <label for="patient_id">Family Member:</label>
                        <select id="patient_id" required>
                            <option value="">Select Family Member</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="doctor_id">Doctor:</label>
                        <select id="doctor_id" required>
                            <option value="">Select Doctor</option>
                        </select>
                    </div>
                    <button type="submit">Assign Doctor</button>
                </form>
            </div>

            <!-- Assigned doctor's contact info -->
            <h3>Assigned Doctor</h3>
            <div id="doctorCard" class="form-container">
                <p class="loading">Select a family member above to see their assigned doctor.</p>
            </div>
        </main>
    </div>

    <script src="js/config.js?v=3"></script>
    <script>checkAuth();</script>
    <script src="js/doctor.js"></script>
    <script src="js/medicine-bot.js?v=3"></script>

</body>
</html>
